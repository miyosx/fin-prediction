[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "data", "indicators", "app", "ml"]

[project]
name = "fin-prediction"
version = "0.1.0"
description = "Market breadth visualization and prediction tool"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pandas-ta>=0.3.14b",
    "streamlit>=1.35",
    "plotly>=5.22",
    "scipy>=1.13",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "shap>=0.45",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
